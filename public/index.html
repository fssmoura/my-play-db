<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my-play-db</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>

  <body>
    <!-- Signed out -->
    <section id="gate" class="gate hidden">
      <h1>my-play-db</h1>
      <p>Private game library. Owner access only.</p>
      <p id="gate-error" class="status-line error"></p>
      <button id="sign-in">Sign in with Google</button>
    </section>

    <!-- Booting -->
    <section id="loading" class="gate">
      <p>Loading...</p>
    </section>

    <!-- Signed in -->
    <div id="app" class="hidden">
      <header class="app-bar">
        <h1>my-play-db</h1>
        <div class="app-bar-right">
          <span id="user-email"></span>
          <button id="sign-out">Sign out</button>
        </div>
      </header>

      <nav class="tabs">
        <button data-view="connections" aria-selected="true">
          Connections
        </button>
        <button data-view="console" aria-selected="false">API console</button>
      </nav>

      <main>
        <section id="view-connections"></section>
        <section id="view-console" class="hidden"></section>
      </main>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
