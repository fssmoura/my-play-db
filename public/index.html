<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my-play-db</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/sign-in.css" />
    <link rel="stylesheet" href="/css/menu.css" />
    <link rel="stylesheet" href="/css/pages.css" />
    <link rel="stylesheet" href="/css/overlay-scroll.css" />
  </head>

  <body>
    <!-- Signed out -->
    <section id="gate" class="login hidden">
      <h1>Welcome back</h1>
      <p class="login-sub">Sign in to your account</p>

      <button type="button" id="sign-in" class="btn btn-google">
        <span class="spinner" aria-hidden="true"></span>
        <span class="google-chip" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="16" height="16">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
        </span>
        <span class="btn-label">Continue with Google</span>
      </button>

      <div class="login-or"><span>or</span></div>

      <form id="password-form" novalidate>
        <div class="field">
          <label for="auth-email">Email</label>
          <input
            id="auth-email"
            type="email"
            inputmode="email"
            placeholder="you@example.com"
            autocomplete="username email"
            autocapitalize="off"
            spellcheck="false"
            aria-describedby="email-error"
            required
          />
          <p id="email-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <div class="password-wrap">
            <input
              id="auth-password"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="password-toggle"
              class="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg
                id="password-icon"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="submit" class="btn btn-primary">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">Sign In</span>
        </button>
        <p id="gate-error" class="login-error" role="alert"></p>
      </form>
    </section>

    <!-- Booting -->
    <section id="loading" class="gate">
      <p>Loading...</p>
    </section>

    <script type="module" src="/js/sign-in.js"></script>
    <script src="/js/dev-reload.js"></script>
  </body>
</html>
