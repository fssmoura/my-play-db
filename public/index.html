<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my-play-db</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>

  <body>
    <!-- Signed out -->
    <section id="gate" class="login hidden">
      <h1>Welcome back</h1>
      <p class="login-sub">Sign in to your account</p>
      <button id="sign-in" class="login-google">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M21.35 11.1H12v2.9h5.35c-.5 2.4-2.5 3.9-5.35 3.9a6 6 0 1 1 0-12c1.5 0 2.8.55 3.85 1.45l2.1-2.1A9 9 0 1 0 12 21c5.2 0 9.0-3.65 9.0-8.8 0-.35-.03-.75-.1-1.1z"
          />
        </svg>
        Continue with Google
      </button>
      <div class="login-or"><span>or</span></div>
      <form id="password-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input
            id="auth-email"
            type="email"
            placeholder="you@example.com"
            autocomplete="username"
            required
          />
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <div class="password-wrap">
            <input
              id="auth-password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="password-toggle"
              class="password-toggle"
              aria-label="Show password"
            >
              <svg
                id="password-icon"
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="login-submit">Sign in</button>
        <p id="gate-error" class="status-line error"></p>
      </form>
    </section>

    <!-- Booting -->
    <section id="loading" class="gate">
      <p>Loading...</p>
    </section>

    <!-- Signed in -->
    <div id="app" class="hidden">
      <header class="app-bar">
        <h1>my-play-db</h1>
        <div class="app-bar-right">
          <span id="user-email"></span>
          <button id="sign-out">Sign out</button>
        </div>
      </header>

      <nav class="tabs">
        <button data-view="connections" aria-selected="true">
          Connections
        </button>
        <button data-view="console" aria-selected="false">API console</button>
        <button data-view="search" aria-selected="false">Search</button>
        <button data-view="game" aria-selected="false">Game</button>
        <!-- Only reachable from a game page's "Select media" button, so it
             stays hidden until you have been there. -->
        <button data-view="media" aria-selected="false" class="hidden">
          Media
        </button>
      </nav>

      <main>
        <section id="view-connections"></section>
        <section id="view-console" class="hidden"></section>
        <section id="view-search" class="hidden"></section>
        <section id="view-game" class="hidden"></section>
        <section id="view-media" class="hidden"></section>
      </main>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
