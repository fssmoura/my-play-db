<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my-play-db</title>
    <link rel="stylesheet" href="/lab/css/app.css" />
  </head>

  <body>
    <!-- Booting -->
    <section id="loading" class="gate">
      <p>Loading...</p>
    </section>

    <!-- Signed in -->
    <div id="app" class="hidden">
      <header class="app-bar">
        <h1>my-play-db</h1>
        <div class="app-bar-right">
          <a href="/">Back to app</a>
          <span id="user-email"></span>
          <button id="sign-out">Sign out</button>
        </div>
      </header>

      <nav class="tabs">
        <button data-view="connections" aria-selected="true">
          Connections
        </button>
        <button data-view="console" aria-selected="false">API console</button>
        <button data-view="library" aria-selected="false">Library</button>
        <!-- Game is only reachable from a library card, and Media and
             Achievements only from a game page's buttons, so each stays
             hidden until you have been there. -->
        <button data-view="game" aria-selected="false" class="hidden">
          Game
        </button>
        <button data-view="media" aria-selected="false" class="hidden">
          Media
        </button>
        <button data-view="achievements" aria-selected="false" class="hidden">
          Achievements
        </button>
      </nav>

      <main>
        <section id="view-connections"></section>
        <section id="view-console" class="hidden"></section>
        <section id="view-library" class="hidden"></section>
        <section id="view-game" class="hidden"></section>
        <section id="view-media" class="hidden"></section>
        <section id="view-achievements" class="hidden"></section>
      </main>
    </div>

    <script type="module" src="/lab/js/app.js"></script>
    <script src="/js/dev-reload.js"></script>
  </body>
</html>
